# DHCP only; DNS is disabled.
port=0

# Mac Ethernet interface directly connected to the switch.
interface=en5
bind-interfaces

# Appropriate only on this isolated Mac-to-switch connection.
dhcp-authoritative

# Show DHCP activity in the foreground terminal.
log-dhcp
log-facility=-

# Lease database.
dhcp-leasefile=/Users/Shared/ztp-lab/dnsmasq.leases

# Address pool for the switch.
dhcp-range=192.168.77.100,192.168.77.150,255.255.255.0,1h

# Do not advertise a router or DNS server.
dhcp-option=option:router
dhcp-option=option:dns-server

# SONiC ZTP JSON URL in DHCP Option 67.
dhcp-option-force=67,"http://192.168.77.1:8000/ztp/ztp.json"
